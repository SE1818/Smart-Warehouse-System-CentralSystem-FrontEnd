map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Gzip compression để tăng tốc load
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # DNS resolver for upstream proxying (Docker internal DNS + public fallbacks)
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Reverse proxy API requests to Cloud / Central API Gateway
    location /api/ {
        set $backend_upstream "https://stereo-gravity-humbly.ngrok-free.dev";
        proxy_pass $backend_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host stereo-gravity-humbly.ngrok-free.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "true";
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Khâu sinh tử của Single Page Application (React Router)
        # Mọi route đều trả về index.html, để React Router tự xử lý
        try_files $uri $uri/ /index.html;
    }

    # Cache các assets tĩnh (JS, CSS, images) — Vite tự hash tên file
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
